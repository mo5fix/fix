<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>i-FiX</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    /* PS4-inspired background */
    background:
        radial-gradient(circle at 80% 25%, rgba(0, 110, 255, .25), transparent 30%),
        radial-gradient(circle at 15% 70%, rgba(0, 70, 180, .20), transparent 35%),
        linear-gradient(135deg, #02040b 0%, #06152d 50%, #01030a 100%);

    overflow-x: hidden;
}

/* Decorative blue light */
body::before {
    content: "";
    position: fixed;
    width: 900px;
    height: 3px;
    background: #008cff;
    box-shadow: 0 0 25px #008cff;
    transform: rotate(-18deg);
    top: 35%;
    left: -180px;
    opacity: .6;
}

/* Decorative circles */
body::after {
    content: "△   ○   ×   □";
    position: fixed;
    right: 25px;
    top: 80px;
    font-size: 48px;
    letter-spacing: 18px;
    color: rgba(0, 140, 255, .25);
    transform: rotate(-15deg);
}

header {
    text-align: center;
    padding: 55px 20px 25px;
}

.logo {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 10px;
    color: #fff;
    text-shadow:
        0 0 8px rgba(0, 140, 255, .8),
        0 0 25px rgba(0, 100, 255, .5);
}

.subtitle {
    margin-top: 8px;
    color: #008cff;
    letter-spacing: 5px;
    font-size: 13px;
}

#UA {
    margin-top: 30px;
    font-size: 18px;
    font-weight: normal;
}

hr {
    border: 0;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #008cff,
        transparent
    );
    margin: 15px auto 30px;
    width: 80%;
}

.container {
    width: min(900px, 92%);
    margin: auto;
}

.panel {
    background: rgba(2, 10, 25, .88);
    border: 1px solid rgba(0, 140, 255, .65);
    border-radius: 18px;
    box-shadow:
        0 0 25px rgba(0, 100, 255, .18),
        inset 0 0 30px rgba(0, 50, 120, .12);
    padding: 30px;
}

.options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    flex-wrap: wrap;
}

.kernel {
    display: flex;
    gap: 18px;
    align-items: center;
}

.kernel-title {
    color: #008cff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

input[type="radio"],
input[type="checkbox"] {
    accent-color: #008cff;
}

label {
    cursor: pointer;
}

#jeilbrek {
    min-width: 190px;
    padding: 15px 30px;
    border: 1px solid #008cff;
    border-radius: 8px;
    background: linear-gradient(135deg, #0066ff, #0040a0);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(0, 100, 255, .35);
    transition: .2s;
}

#jeilbrek:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 28px rgba(0, 140, 255, .65);
}

.autoJb {
    display: flex;
    align-items: center;
    gap: 10px;
}

.console-box {
    margin-top: 25px;
}

.console-title {
    color: #008cff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

#console {
    height: 220px;
    overflow-y: auto;
    margin: 0;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #007cff;
    background: #01050d;
    color: #00aaff;
    font-family: Consolas, monospace;
    font-size: 14px;
    box-shadow: inset 0 0 25px rgba(0, 100, 255, .12);
}

.footer {
    text-align: center;
    padding: 25px;
    color: #6684a8;
    font-size: 12px;
}

.footer strong {
    color: #008cff;
}

@media (max-width: 650px) {
    .logo {
        font-size: 42px;
        letter-spacing: 6px;
    }

    .options {
        flex-direction: column;
        align-items: stretch;
    }

    .kernel {
        justify-content: center;
        flex-wrap: wrap;
    }

    #jeilbrek {
        width: 100%;
    }

    .autoJb {
        justify-content: center;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">i-FiX</div>
    <div class="subtitle">PLAYSTATION 4 TOOL</div>

    <h3 id="UA">Running on: PS4</h3>
</header>

<hr>

<div class="container">

    <div class="panel">

        <div class="options">

            <div>
                <div class="kernel-title">KERNEL OPTION</div>

                <div class="kernel">
                    <label>
                        <input
                            type="radio"
                            name="kernel"
                            value="netctrl"
                            checked
                        >
                        NetCtrl
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="kernel"
                            value="lapse"
                        >
                        Lapse
                    </label>
                </div>
            </div>

            <button id="jeilbrek">
                Jeilbrek
            </button>

            <div class="autoJb">
                <input
                    id="autoJbInput"
                    type="checkbox"
                >

                <label for="autoJbInput">
                    Auto Jailbreak
                </label>
            </div>

        </div>

        <div class="console-box">

            <div class="console-title">
                CONSOLE
            </div>

            <pre id="console">Ready. Awaiting execution...</pre>

        </div>

    </div>

</div>

<div class="footer">
    <strong>i-FiX</strong>
    &nbsp; • &nbsp;
    PS4 Interface
    &nbsp; • &nbsp;
    UI Demo
</div>

<script>
const consoleBox = document.getElementById("console");
const button = document.getElementById("jeilbrek");
const autoJb = document.getElementById("autoJbInput");

function log(message) {
    consoleBox.textContent += "\n" + message;
    consoleBox.scrollTop = consoleBox.scrollHeight;
}

button.addEventListener("click", function () {
    const selected = document.querySelector(
        'input[name="kernel"]:checked'
    );

    log("");
    log("> i-FiX started");
    log("> Selected: " + selected.value);
    log("> Interface test completed");
    log("> No exploit was executed.");
});

autoJb.addEventListener("change", function () {
    if (this.checked) {
        log("> Auto mode enabled.");
    } else {
        log("> Auto mode disabled.");
    }
});
</script>

</body>
</html>
