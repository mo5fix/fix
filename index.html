<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-FiX - CSSFontFace UAF Exploit</title>
    <style>
        /* كود ألوان مسطح ومتوافق تماماً مع متصفح PS4 الضعيف */
        body {
            background-color: #001c4d;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #0070d1;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #0070d1;
        }

        /* تنسيق قائمة الاختيارات المنفصلة */
        .select-container {
            margin: 20px auto;
        }

        select {
            padding: 12px;
            font-size: 1.1rem;
            background-color: #121212;
            color: #ffffff;
            border: 2px solid #0070d1;
            border-radius: 5px;
            width: 80%;
            max-width: 300px;
            cursor: pointer;
        }

        /* أزرار التفعيل المنفصلة والمستقلة */
        .btn-container {
            margin: 20px 0;
        }

        .action-btn {
            background-color: #00ea1e;
            color: #000000;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 300px;
        }

        .action-btn:active {
            background-color: #00b717;
        }

        /* شريط التحميل البسيط القائم على العرض المباشر لمتصفح PS4 */
        .progress-box {
            width: 80%;
            max-width: 300px;
            background-color: #222;
            border: 1px solid #555;
            height: 15px;
            margin: 20px auto;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #0070d1;
        }

        .status-text {
            font-size: 1.2rem;
            color: #ffff5c;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>i-FiX</h1>
    
    <div class="info-box">
        <strong>Running on:</strong> netctrl | lapse | Auto Jailbreak
    </div>

    <!-- 1. قائمة خيارات منفصلة تماماً ومستقلة اختيارياً -->
    <div class="select-container">
        <select id="payloadSelect">
            <option value="none">-- اختر الـ Payload المطلوب --</option>
            <option value="goldhen">GoldHEN v2.4b</option>
            <option value="ftp">FTP Server</option>
            <option value="backup">Database Backup</option>
            <option value="linux">Linux Loader</option>
        </select>
    </div>

    <!-- 2. زر تفعيل منفصل لا يطلق أي أمر إلا عند الضغط اليدوي عليه لتجنب تجميد المتصفح -->
    <div class="btn-container">
        <button class="action-btn" id="runBtn" type="button">تفعيل الثغرة الآن</button>
    </div>

    <!-- شريط تحميل متوافق مع نظام كاش الـ PS4 -->
    <div class="progress-box">
        <div id="ps4Bar" class="progress-fill"></div>
    </div>

    <!-- نصوص الحالة التفاعلية نقية وبدون مؤثرات ثقيلة -->
    <div id="ps4Status" class="status-text">
        Ready. Select payload and click activate.
    </div>

    <!-- جافا سكريبت آمن وخفيف مخصص لثغرات ويب كيت الـ PS4 -->
    <script>
        var runBtn = document.getElementById("runBtn");
        var payloadSelect = document.getElementById("payloadSelect");
        var ps4Bar = document.getElementById("ps4Bar");
        var ps4Status = document.getElementById("ps4Status");
        var progressWidth = 0;
        var progressInterval;

        // عند النقر اليدوي والمنفصل على زر التفعيل
        runBtn.onclick = function() {
            var selectedValue = payloadSelect.value;
            
            if (selectedValue === "none") {
                ps4Status.innerHTML = "خطأ: يرجى اختيار Payload أولاً!";
                ps4Status.style.color = "#ff5c5c";
                return;
            }

            // تصفير وإعادة تعيين شريط الأوامر
            progressWidth = 0;
            ps4Bar.style.width = "0%";
            ps4Status.innerHTML = "جاري تفعيل " + payloadSelect.options[payloadSelect.selectedIndex].text + "...";
            ps4Status.style.color = "#0070d1";

            // تشغيل العداد يدوياً وبطريقة آمنة لا تسبب انهيار المتصفح (Crash)
            clearInterval(progressInterval);
            progressInterval = setInterval(function() {
                if (progressWidth >= 100) {
                    clearInterval(progressInterval);
                    ps4Status.innerHTML = "تم التفعيل بنجاح! Exploit Loaded.";
                    ps4Status.style.color = "#00ea1e";
                    
                    // هنا يتم استدعاء دالة تشغيل الثغرة الفعلية لجهازك
                    triggerExploit(selectedValue);
                } else {
                    progressWidth += 2; // سرعة ملء متوازنة وثابتة
                    ps4Bar.style.width = progressWidth + "%";
                }
            }, 40);
        };

        // دالة مفرغة مخصصة لربط ملفات الثغرة الحقيقية لاحقاً
        function triggerExploit(type) {
            console.log("Triggering: " + type);
            // يمكنك وضع استدعاء ملفات الـ JS الخاصة بالثغرة الفعلية هنا
        }
    </script>

</body>
</html>
