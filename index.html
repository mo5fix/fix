<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>i-FiX - CSSFontFace UAF Exploit</title>
    <style>
        /* خلفية متدرجة بألوان واجهة البلايستيشن الزرقاء */
        body {
            background: radial-gradient(circle, #003791 0%, #001c4d 100%);
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        .ps5-controller {
            width: 350px;
            height: auto;
            margin: 20px auto;
            display: block;
            filter: drop-shadow(0px 0px 25px #0070d1); 
        }

        /* تصميم شريط الأوامر والتحميل */
        .progress-container {
            width: 300px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 25px auto;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 0px 15px rgba(0, 112, 209, 0.4);
        }

        .progress-bar {
            width: 0%;
            height: 8px;
            background: linear-gradient(90deg, #0070d1, #00ea1e);
            border-radius: 8px;
            animation: loadProgress 3s ease-in-out infinite;
        }

        /* حركة الشريط التلقائية */
        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .status-text {
            font-size: 1.2rem;
            color: #00ea1e;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 234, 30, 0.5);
        }

        h1, h3, p {
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>i-FiX</h1>
    <h3>Running on:</h3>
    <p>[-] netctrl</p>
    <p>[-] lapse</p>
    <p>Jeilbrek - Auto Jailbreak</p>
    
    <!-- رابط بديل مباشر ومفتوح لذراع التحكم لضمان الظهور الفوري -->
    <img src="https://githubusercontent.com" alt="PS5 Controller" class="ps5-controller">

    <!-- شريط تحميل الأوامر الجديد -->
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

    <div class="status-text">
        Ready. Awaiting execution...
    </div>

</body>
</html>
